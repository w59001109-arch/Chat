<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HERMES">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">
  <title>HERMES</title>
  <style>
    :root {
      --g:  #00ff41;
      --gd: rgba(0,255,65,.35);
      --c:  #00ccff;
      --r:  #ff4141;
      --a:  #ffb347;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: var(--g);
      font-family: 'Courier New', 'Lucida Console', monospace;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Matrix rain ─────────────────────────────────────────────────────── */
    #mtx {
      position: fixed;
      inset: 0;
      opacity: .13;
      z-index: 0;
      pointer-events: none;
    }

    /* ── CRT scanlines ───────────────────────────────────────────────────── */
    #scn {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,.04) 2px,
        rgba(0,0,0,.04) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    #app {
      position: relative;
      z-index: 2;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    #hdr {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 16px;
      background: rgba(0,0,0,.85);
      border-bottom: 1px solid var(--gd);
      backdrop-filter: blur(8px);
    }

    #logo {
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 6px;
      text-shadow: 0 0 10px var(--g), 0 0 30px var(--g);
      animation: glitch 12s infinite;
    }

    @keyframes glitch {
      0%,88%,100% {
        transform: none;
        text-shadow: 0 0 10px var(--g), 0 0 30px var(--g);
      }
      89% { transform: translate(-3px, 0); text-shadow:  3px 0 var(--c), -3px 0 var(--r); }
      90% { transform: translate( 3px, 0); text-shadow: -3px 0 var(--c),  3px 0 var(--r); }
      91% { transform: translate(-1px, 0); text-shadow:  0 0 10px var(--g); }
      92% { transform: none; text-shadow: 0 0 10px var(--g), 0 0 30px var(--g); }
      94% { transform: translate( 2px,-1px); text-shadow: -2px 0 var(--r); }
      95% { transform: none; text-shadow: 0 0 10px var(--g), 0 0 30px var(--g); }
    }

    #hdr-r {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--gd);
    }

    /* agent toggle */
    #agent-btn {
      background: transparent;
      border: 1px solid;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      padding: 3px 9px;
      cursor: pointer;
      transition: background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    #agent-btn.hermes { border-color: var(--g); color: var(--g); text-shadow: 0 0 6px var(--g); }
    #agent-btn.claude { border-color: var(--c); color: var(--c); text-shadow: 0 0 6px var(--c); }
    #agent-btn:active { opacity: .6; }

    #clk { font-variant-numeric: tabular-nums; }

    #dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--r);
      flex-shrink: 0;
    }
    #dot.on {
      background: var(--g);
      box-shadow: 0 0 7px var(--g);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

    #sta { color: var(--r); }
    #sta.on { color: var(--g); }

    /* ── Loading bar ─────────────────────────────────────────────────────── */
    #bar {
      flex-shrink: 0;
      height: 2px;
      position: relative;
      overflow: hidden;
    }
    #bar.on::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--g), transparent);
      box-shadow: 0 0 8px var(--g);
      animation: sweep 1.6s ease-in-out infinite;
    }
    @keyframes sweep {
      0%   { width: 0%;  left: 0%; }
      50%  { width: 60%; left: 20%; }
      100% { width: 0%;  left: 100%; }
    }

    /* ── Messages ────────────────────────────────────────────────────────── */
    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--gd) transparent;
    }
    #msgs::-webkit-scrollbar { width: 3px; }
    #msgs::-webkit-scrollbar-thumb { background: var(--gd); border-radius: 2px; }

    .m { font-size: 14px; line-height: 1.65; }

    .m-box {
      border: 1px solid;
      border-radius: 2px;
    }

    .m-tag {
      padding: 3px 11px;
      font-size: 10px;
      letter-spacing: 2px;
      border-bottom: 1px solid;
    }

    .m-body {
      padding: 9px 11px;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-user-select: text;
      user-select: text;
    }

    /* user */
    .m-u { margin-left: 18px; }
    .m-u .m-box  { border-color: rgba(0,204,255,.22); }
    .m-u .m-tag  { background: rgba(0,204,255,.06); border-color: rgba(0,204,255,.14); color: var(--c); }
    .m-u .m-body { color: rgba(0,204,255,.82); }

    /* assistant */
    .m-a { margin-right: 18px; }
    .m-a .m-box  { border-color: rgba(0,255,65,.2); }
    .m-a .m-tag  { background: rgba(0,255,65,.05); border-color: rgba(0,255,65,.12); color: var(--g); text-shadow: 0 0 8px var(--g); }
    .m-a .m-body { color: rgba(0,255,65,.87); }

    /* system */
    .m-s .m-box  { border-color: rgba(255,179,71,.18); }
    .m-s .m-tag  { background: rgba(255,179,71,.04); border-color: rgba(255,179,71,.11); color: var(--a); }
    .m-s .m-body { color: rgba(255,179,71,.6); font-size: 12px; }

    /* error */
    .m-e .m-box  { border-color: rgba(255,65,65,.22); }
    .m-e .m-tag  { background: rgba(255,65,65,.06); border-color: rgba(255,65,65,.14); color: var(--r); }
    .m-e .m-body { color: rgba(255,65,65,.78); }

    /* blinking cursor in streaming */
    .cur {
      display: inline-block;
      width: 8px; height: 14px;
      background: var(--g);
      vertical-align: text-bottom;
      margin-left: 1px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Input area ──────────────────────────────────────────────────────── */
    #inp-wrap {
      flex-shrink: 0;
      padding: 10px 14px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--gd);
      background: rgba(0,0,0,.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .arrow {
      color: var(--g);
      font-size: 20px;
      line-height: 1;
      padding-bottom: 9px;
      text-shadow: 0 0 10px var(--g);
      flex-shrink: 0;
    }

    #inp {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--gd);
      color: var(--c);
      font-family: 'Courier New', monospace;
      font-size: 15px;
      padding: 8px 0;
      outline: none;
      resize: none;
      max-height: 100px;
      line-height: 1.45;
      caret-color: var(--g);
    }
    #inp::placeholder { color: var(--gd); }
    #inp:focus { border-color: var(--g); }
    #inp:disabled { opacity: .4; }

    #btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--g);
      color: var(--g);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      padding: 8px 13px;
      cursor: pointer;
      text-shadow: 0 0 7px var(--g);
      transition: background .15s, box-shadow .15s;
    }
    #btn:not(:disabled):active { background: rgba(0,255,65,.12); box-shadow: 0 0 12px var(--gd); }
    #btn:disabled { opacity: .28; cursor: not-allowed; }
  </style>
</head>
<body>

<canvas id="mtx"></canvas>
<div id="scn"></div>

<div id="app">
  <div id="hdr">
    <div id="logo">HERMES</div>
    <button id="agent-btn" class="hermes">HERMES ⇄</button>
    <div id="hdr-r">
      <span id="clk">--:--:--</span>
      <div id="dot"></div>
      <span id="sta">OFFLINE</span>
    </div>
  </div>

  <div id="bar"></div>
  <div id="msgs"></div>

  <div id="inp-wrap">
    <span class="arrow">›</span>
    <textarea id="inp" placeholder="輸入指令... (Shift+Enter 換行)" rows="1" disabled></textarea>
    <button id="btn" disabled>EXEC</button>
  </div>
</div>

<script>
// ── Matrix rain ──────────────────────────────────────────────────────────────
!function () {
  const cv = document.getElementById('mtx');
  const cx = cv.getContext('2d');
  const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/\\{}[]|';
  const SIZE = 14;
  let cols, drops;

  function resize() {
    cv.width  = innerWidth;
    cv.height = innerHeight;
    cols  = Math.floor(innerWidth / SIZE);
    drops = Array(cols).fill(1);
  }
  resize();
  addEventListener('resize', resize);

  setInterval(() => {
    cx.fillStyle = 'rgba(0,0,0,0.05)';
    cx.fillRect(0, 0, cv.width, cv.height);
    cx.font = SIZE - 1 + 'px monospace';
    for (let i = 0; i < cols; i++) {
      const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
      cx.fillStyle = drops[i] === 1 ? '#ccffdd' : '#00ff41';
      cx.fillText(ch, i * SIZE, drops[i] * SIZE);
      if (drops[i] * SIZE > cv.height && Math.random() > .975) drops[i] = 0;
      drops[i]++;
    }
  }, 50);
}();

// ── Clock ────────────────────────────────────────────────────────────────────
!function () {
  const el = document.getElementById('clk');
  function tick() { el.textContent = new Date().toLocaleTimeString('zh-TW', { hour12: false }); }
  tick();
  setInterval(tick, 1000);
}();

// ── Chat ─────────────────────────────────────────────────────────────────────
!function () {
  const msgs      = document.getElementById('msgs');
  const bar       = document.getElementById('bar');
  const dot       = document.getElementById('dot');
  const sta       = document.getElementById('sta');
  const inp       = document.getElementById('inp');
  const btn       = document.getElementById('btn');
  const agentBtn  = document.getElementById('agent-btn');

  let ws = null, online = false, busy = false;
  let stream = null;
  let mid = 0;
  let currentAgent = 'hermes';

  // ── State helpers ──────────────────────────────────────────────────────────
  function setOnline(v) {
    online = v;
    dot.className = v ? 'on' : '';
    sta.className = v ? 'on' : '';
    sta.textContent = v ? 'ONLINE' : 'OFFLINE';
    syncInput();
  }

  function setBusy(v) {
    busy = v;
    bar.className = v ? 'on' : '';
    btn.textContent = v ? '···' : 'EXEC';
    syncInput();
  }

  function syncInput() {
    const ok = online && !busy;
    inp.disabled = !ok;
    btn.disabled = !ok;
    agentBtn.disabled = !online || busy;
    if (ok) inp.focus();
  }

  function setAgent(name) {
    currentAgent = name;
    agentBtn.className = name;
    agentBtn.textContent = name.toUpperCase() + ' ⇄';
  }

  // ── Message rendering ──────────────────────────────────────────────────────
  function addMsg(cls, tag, text) {
    const w = document.createElement('div'); w.className = 'm ' + cls;
    const b = document.createElement('div'); b.className = 'm-box';
    const t = document.createElement('div'); t.className = 'm-tag'; t.textContent = tag;
    const d = document.createElement('div'); d.className = 'm-body'; d.textContent = text || '';
    b.append(t, d); w.append(b); msgs.append(w);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function startStream() {
    const w = document.createElement('div'); w.className = 'm m-a';
    const b = document.createElement('div'); b.className = 'm-box';
    const t = document.createElement('div'); t.className = 'm-tag'; t.textContent = currentAgent.toUpperCase() + ' ▸ PROCESSING';
    const d = document.createElement('div'); d.className = 'm-body';
    const c = document.createElement('span'); c.className = 'cur';
    d.append(c);
    b.append(t, d); w.append(b); msgs.append(w);
    stream = { tagEl: t, bodyEl: d, text: '' };
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendStream(chunk) {
    if (!stream) return;
    stream.text += chunk;
    stream.bodyEl.textContent = stream.text;
    const c = document.createElement('span'); c.className = 'cur';
    stream.bodyEl.append(c);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function endStream() {
    if (stream) {
      stream.bodyEl.textContent = stream.text;
      stream.tagEl.textContent = currentAgent.toUpperCase() + ' ▸ OUTPUT';
      stream = null;
    }
    setBusy(false);
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────
  function handle(d) {
    if      (d.type === 'system')       { addMsg('m-s', 'SYS ▸ INFO', d.text); setOnline(true); }
    else if (d.type === 'agent_status') { setAgent(d.agent); }
    else if (d.type === 'start')        { startStream(); }
    else if (d.type === 'delta')        { appendStream(d.text); }
    else if (d.type === 'done')         { endStream(); }
    else if (d.type === 'error')        { endStream(); addMsg('m-e', 'SYS ▸ ERROR', d.message); }
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host);

    ws.onopen  = () => setOnline(true);
    ws.onclose = () => {
      setOnline(false);
      endStream();
      addMsg('m-s', 'SYS ▸ WARN', 'CONNECTION LOST — RECONNECTING IN 3s...');
      setTimeout(connect, 3000);
    };
    ws.onerror = () => setOnline(false);
    ws.onmessage = (e) => {
      let d; try { d = JSON.parse(e.data); } catch { return; }
      handle(d);
    };
  }

  // ── Send ───────────────────────────────────────────────────────────────────
  function send() {
    const text = inp.value.trim();
    if (!text || !online || busy || !ws || ws.readyState !== 1) return;
    addMsg('m-u', 'YOU ▸ INPUT', text);
    inp.value = '';
    inp.style.height = 'auto';
    setBusy(true);
    ws.send(JSON.stringify({ type: 'message', id: ++mid, content: text }));
  }

  btn.addEventListener('click', send);

  agentBtn.addEventListener('click', () => {
    const next = currentAgent === 'hermes' ? 'claude' : 'hermes';
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'switch', agent: next }));
  });

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
  });

  addMsg('m-s', 'SYS ▸ BOOT', 'INITIALIZING HERMES... CONNECTING TO SERVER...');
  connect();
}();
</script>
</body>
</html>
